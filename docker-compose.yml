version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_AGENT_URL: ws://localhost:8765
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - agent
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_AGENT_URL=ws://localhost:8765

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/AI_Sandbox.db
    volumes:
      - ./backend/data:/app/data

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "8765:8765"
    env_file:
      - ./agent/.env          # loads LETZEVAL_LLM_PROVIDER, OPENAI_API_KEY, etc.
    environment:
      - LETZEVAL_DB_PATH=/app/data/AI_Sandbox.db   # override db path (always needed)
    volumes:
      - ./backend/data:/app/data:ro
